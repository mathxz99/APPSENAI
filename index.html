<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Elegibilidade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Validação para Vaga</h2>
        
        <form id="vagaForm">
            <div class="input-group">
                <label for="nome">Nome do Candidato</label>
                <input type="text" id="nome" required placeholder="Digite o nome">
            </div>

            <div class="input-group">
                <label for="idade">Idade (anos)</label>
                <input type="number" id="idade" required placeholder="Ex: 20">
            </div>

            <div class="input-group">
                <label for="altura">Altura (metros)</label>
                <input type="text" id="altura" required placeholder="Ex: 1.75">
            </div>

            <button type="submit">Verificar Elegibilidade</button>
        </form>
    </div>

    <!-- POP-UP MODAL DE RESPOSTA -->
    <div id="popupModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div id="modalIcon" class="icon"></div>
            <h3 id="modalTitle"></h3>
            
            <!-- MENSAGEM DO CRITÉRIO -->
            <p id="modalMessage" class="mensagem"></p>
            
            <div class="resumo">
                <p><strong>Nome:</strong> <span id="resNome"></span></p>
                <p><strong>Idade:</strong> <span id="resIdade"></span></p>
                <p><strong>Altura:</strong> <span id="resAltura"></span></p>
            </div>

            <!-- BOTÃO OK PARA FECHAR -->
            <button onclick="fecharModal()" class="btn-ok">OK / Entendido</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
